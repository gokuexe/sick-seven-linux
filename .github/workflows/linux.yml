name: Compilar Linux

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      - name: Dependencias del escritorio Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libblkid-dev liblzma-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Preparar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Habilitar escritorio
        run: flutter config --enable-linux-desktop

      - name: Generar la carpeta de Linux
        run: flutter create . --platforms=linux --project-name sick_seven

      - name: Abrir con proporción de celular, no de escritorio
        run: |
          sed -i 's/gtk_window_set_default_size(window, 1280, 720)/gtk_window_set_default_size(window, 520, 900)/' linux/runner/my_application.cc

      - name: Bajar dependencias
        run: flutter pub get

      - name: Compilar
        run: flutter build linux --release

      - name: Empaquetar en un tar.gz
        run: |
          cd build/linux/x64/release
          tar -czf ../../../../SickSeven-Linux.tar.gz bundle

      - name: Guardar el tarball
        uses: actions/upload-artifact@v4
        with:
          name: sick-seven-linux
          path: SickSeven-Linux.tar.gz

      - name: Publicar para descarga directa
        uses: softprops/action-gh-release@v2
        with:
          tag_name: linux
          name: Sick Seven - Linux
          files: SickSeven-Linux.tar.gz
          overwrite_files: true
